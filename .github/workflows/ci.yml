name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run in flight. The Android job is
# slow and the result it produces is superseded by the newer commit anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # pinned to the version CONTRIBUTING.md tells contributors to use, so
          # CI and the local instructions cannot drift apart
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Parse the shared backup fixture with the real Rust OII engine. Host
      # target only, so no Android Rust targets are needed for this check.
      - name: Test the oii bridge
        run: cargo test --manifest-path packages/oii_bridge/native/Cargo.toml

      # And the same fixture read back across the real FFI boundary, which is
      # the only place the two readers actually meet.
      - name: Test the oii bridge over ffi
        working-directory: packages/oii_bridge
        run: |
          flutter pub get
          flutter test

      # A fixture that drifts is a silent lie: dart would keep passing its own
      # half while the files stopped being oii. Fail loudly instead.
      - name: Check the shared oii fixture is up to date
        run: |
          dart run tool/regen_oii_fixture.dart
          if ! git diff --quiet -- packages/oii_bridge/testdata; then
            echo "::error::the shared oii fixture is stale. Run 'dart run tool/regen_oii_fixture.dart' and commit the result."
            git diff --stat -- packages/oii_bridge/testdata
            exit 1
          fi

      # the generated localisations are committed, so a change that forgets to
      # re-run gen-l10n would otherwise only fail on a contributor's machine
      - name: Check the generated localizations are up to date
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n/gen; then
            echo "::error::lib/l10n/gen is out of date. Run 'flutter gen-l10n' and commit the result."
            git diff --stat -- lib/l10n/gen
            exit 1
          fi

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # the runner ships an Android SDK but the licence prompts have to be
      # answered before Gradle will touch it
      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - run: flutter pub get

      # packages/oii_bridge ships a native code asset built by a cargo hook.
      # The runner image carries rustup but only the host target, and a plain
      # `flutter build apk` builds all three Android ABIs, so the hook would
      # fail on the first missing target. These are the exact triples
      # hook/build.dart asks cargo for.
      - name: Install the Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustup target list --installed

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paradise-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-ios:
    name: Test iOS and build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # workmanager_apple references iOS 26 SDK types even when the app runs
      # on older iOS. The macos-15 image defaults to Xcode 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Check Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version

      - run: flutter pub get

      # Setup can exit successfully after skipping a failed download, so check
      # the actual device/simulator slices before invoking CocoaPods.
      - name: Prepare the Typst native libraries
        run: |
          dart run typst_flutter:setup
          python3 tool/check_ios_native.py

      - name: Install iOS pods
        run: pod install --project-directory=ios

      - name: Exercise native plugins on an iPhone simulator
        run: bash tool/run_ios_smoke.sh

      - name: Build unsigned release IPA
        run: bash tool/build_unsigned_ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: paradise-ios-unsigned-ipa
          path: build/ios/ipa/*-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
